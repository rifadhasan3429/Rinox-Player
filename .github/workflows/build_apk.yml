name: Build Rinox Player Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias "$KEY_ALIAS" -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=RinoxPlayer, OU=Dev, O=Rinox, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Release APKs
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare Split Release APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/release/*arm64-v8a*.apk release_apks/Rinox-Player-v1.0.0-arm64-v8a.apk
          cp app/build/outputs/apk/release/*armeabi-v7a*.apk release_apks/Rinox-Player-v1.0.0-armeabi-v7a.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rinox Player v1.0.${{ github.run_number }} (Offline Pro)
          body: |
            ### Rinox Player - Official Release
            - **`Rinox-Player-v1.0.0-arm64-v8a.apk`**: For modern 64-bit Android phones (Recommended)
            - **`Rinox-Player-v1.0.0-armeabi-v7a.apk`**: For older 32-bit Android phones
            - **LibVLC All-In-One FFmpeg Engine + 10-Band Audio Equalizer**
            - **Zero-Load Instant Cache, PiP Mode & Smart Portrait/Landscape**
            - *Crafted by Rifad Hasan*
          files: |
            release_apks/Rinox-Player-v1.0.0-arm64-v8a.apk
            release_apks/Rinox-Player-v1.0.0-armeabi-v7a.apk
