name: Build Rinox Player Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rinox -storepass rinox1234 -keypass rinox1234 -dname "CN=RinoxPlayer, OU=Dev, O=Rinox, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK for Release
        run: mv app/build/outputs/apk/release/app-release.apk Rinox-Player-v1.0.0-arm64.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rinox Player v1.0.${{ github.run_number }} (64-Bit Offline Pro)
          body: |
            ### Rinox Player - Official Release
            - **100% Offline 4K Hybrid Engine (HW / HW+ / SW FFmpeg)**
            - **Zero-Load Instant Cache & 120Hz/144Hz Support**
            - **PiP Mode, Smart Portrait/Landscape & Privacy Vault**
            - *Crafted by Rifad Hasan*
          files: Rinox-Player-v1.0.0-arm64.apk
