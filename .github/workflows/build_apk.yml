name: Build Rinox Player Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rinox -storepass rinox1234 -keypass rinox1234 -dname "CN=RinoxPlayer, OU=Dev, O=Rinox, L=Dhaka, S=Dhaka, C=BD"

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Rinox Player Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rinox-Player-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
